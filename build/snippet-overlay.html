<!-- ── SIGN-IN OVERLAY ──
     Covers the app until Firebase Auth confirms a signed-in
     @advancepsychotherapy.org account. Removed by the auth module. -->
<div id="auth-overlay" style="position:fixed;inset:0;z-index:99999;background:linear-gradient(160deg,#252a52 0%,#1c2142 100%);display:flex;align-items:center;justify-content:center;font-family:'Switzer','Satoshi','Inter',-apple-system,sans-serif">
  <div style="background:#fff;border-radius:18px;padding:40px 44px 34px;max-width:430px;width:90%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.45)">
    <div style="font-size:36px;margin-bottom:8px">🏠</div>
    <div style="font-size:21px;font-weight:800;color:#1b1f3a;letter-spacing:-.02em">Advance Psychotherapy</div>
    <div style="font-size:10.5px;color:#8a8784;text-transform:uppercase;letter-spacing:.13em;margin:3px 0 24px">Homebase · Roster &amp; Capacity</div>
    <div id="auth-msg" style="font-size:13.5px;color:#555;line-height:1.5;margin-bottom:20px">Sign in with your work Google account to continue.</div>
    <button id="auth-signin-btn" style="display:inline-flex;align-items:center;gap:10px;padding:11px 22px;border:1px solid #e0ddd6;border-radius:11px;background:#fff;font-size:14px;font-weight:600;font-family:inherit;color:#1b1f3a;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C41.4 34.9 44 29.9 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Continue with Google
    </button>
    <div id="auth-spinner" style="display:none;font-size:13px;color:#8a8784;padding:10px 0 2px">
      <span style="display:inline-block;width:14px;height:14px;border:2px solid #d6d9e4;border-top-color:#252a52;border-radius:50%;vertical-align:-2px;margin-right:8px;animation:authspin .8s linear infinite"></span>
      Loading your workspace…
    </div>
    <button id="auth-signout-btn" style="display:none;margin-top:14px;padding:8px 18px;border:1px solid #e0ddd6;border-radius:9px;background:#faf9f5;font-size:12.5px;font-weight:600;font-family:inherit;color:#8a8680;cursor:pointer">Sign out &amp; try a different account</button>
    <style>@keyframes authspin{to{transform:rotate(360deg)}}</style>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#e0593c,#e89b4c,#f4d06a,#2fa6ac,#5cc0d0)"></div>
</div>
